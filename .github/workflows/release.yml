name: Package and release DSH plugin

on:
  push:
    branches:
      - main

# Each main-branch push produces its own GitHub Release. `contents: write` is
# required for creating the dsh-plugin-prefixed tag and publishing the asset.
permissions:
  contents: write

jobs:
  release:
    name: Test, package, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test plugin
        run: npm test

      - name: Build npm package
        id: package
        shell: bash
        run: |
          # npm pack emits JSON with the exact generated filename. This avoids
          # relying on shell globbing when a runner has a stale local archive.
          PACK_JSON="$(npm pack --json)"
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="$(node -e "const value = JSON.parse(process.argv[1]); process.stdout.write(value[0].filename)" "$PACK_JSON")"
          test -f "$TARBALL"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Update repository About and dsh-plugin topic
        # About and Topics are GitHub repository settings, not Git-tracked
        # files. Preserve existing topics. Default GITHUB_TOKEN deployments
        # commonly lack repository-administration permission, so a refusal is
        # deliberately non-fatal: releasing the plugin must still succeed.
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                description: 'DSH 插件：为 OpenAI 兼容中转站按模型管理思考强度，并自动识别公开能力。',
                homepage: 'https://github.com/Guyao146/dsh-better-model-thinking-control#readme',
              })
              const current = await github.rest.repos.getAllTopics({
                owner: context.repo.owner,
                repo: context.repo.repo,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              })
              const names = [...new Set([...current.data.names, 'dsh-plugin'])]
              await github.rest.repos.replaceAllTopics({
                owner: context.repo.owner,
                repo: context.repo.repo,
                names,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              })
              core.info(`Updated repository About and Topics: ${names.join(', ')}`)
            } catch (error) {
              core.warning(`Could not update GitHub About/Topics: ${error.message}`)
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Run number makes every push unique without mutating package.json.
          tag_name: dsh-plugin-v${{ steps.package.outputs.version }}-${{ github.run_number }}
          name: DSH Plugin v${{ steps.package.outputs.version }} · build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.tarball }}